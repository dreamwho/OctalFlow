services:
  - type: web
    name: dreamyo
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    healthCheckPath: /api/health/live
    disk:
      name: dreamyo-data
      mountPath: /app/web/.data
      sizeGB: 10
    envVars:
      - fromGroup: dreamyo-runtime
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: UV_THREADPOOL_SIZE
        value: "2"
      - key: DREAMYO_DATA_DIR
        value: /app/web/.data
      - key: DREAMYO_INTERNAL_ORIGIN
        value: http://127.0.0.1:3000
      - key: DREAMYO_DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: dreamyo-postgres
          property: connectionString
      - key: DREAMYO_DATABASE_POOL_MAX
        value: "5"
      - key: DREAMYO_DATABASE_SSL
        value: "1"
      - key: DREAMYO_ENCRYPTION_KEY
        generateValue: true
      - key: GEMINI_TOOLS_OAUTH_CLIENT_ID
        sync: false
      - key: GEMINI_TOOLS_OAUTH_CLIENT_SECRET
        sync: false
      - key: DREAMYO_INSTALL_TOKEN
        generateValue: true
      - key: DREAMYO_MAINTENANCE_TOKEN
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

  - type: worker
    name: dreamyo-generation-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerCommand: node /app/web/scripts/generation-worker.mjs
    envVars:
      - fromGroup: dreamyo-runtime
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: DREAMYO_WORKER_API_ORIGIN
        fromService:
          name: dreamyo
          type: web
          property: hostport

databases:
  - name: dreamyo-postgres
    plan: basic-256mb
    databaseName: dreamyo
    user: dreamyo

envVarGroups:
  - name: dreamyo-runtime
    envVars:
      - key: DREAMYO_WORKER_TOKEN
        generateValue: true
