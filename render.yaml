services:
  - type: web
    name: octalaicanvas
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    healthCheckPath: /api/health/live
    disk:
      name: octalaicanvas-data
      mountPath: /app/web/.data
      sizeGB: 10
    envVars:
      - fromGroup: octalaicanvas-runtime
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: UV_THREADPOOL_SIZE
        value: "2"
      - key: OCTALAICANVAS_DATA_DIR
        value: /app/web/.data
      - key: OCTALAICANVAS_INTERNAL_ORIGIN
        value: http://127.0.0.1:3000
      - key: OCTALAICANVAS_DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: octalaicanvas-postgres
          property: connectionString
      - key: OCTALAICANVAS_DATABASE_POOL_MAX
        value: "5"
      - key: OCTALAICANVAS_DATABASE_SSL
        value: "1"
      - key: OCTALAICANVAS_ENCRYPTION_KEY
        generateValue: true
      - key: OCTALAICANVAS_INSTALL_TOKEN
        generateValue: true
      - key: OCTALAICANVAS_MAINTENANCE_TOKEN
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

  - type: worker
    name: octalaicanvas-generation-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerCommand: node /app/web/scripts/generation-worker.mjs
    envVars:
      - fromGroup: octalaicanvas-runtime
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: OCTALAICANVAS_WORKER_API_ORIGIN
        fromService:
          name: octalaicanvas
          type: web
          property: hostport

databases:
  - name: octalaicanvas-postgres
    plan: basic-256mb
    databaseName: octalaicanvas
    user: octalaicanvas

envVarGroups:
  - name: octalaicanvas-runtime
    envVars:
      - key: OCTALAICANVAS_WORKER_TOKEN
        generateValue: true
