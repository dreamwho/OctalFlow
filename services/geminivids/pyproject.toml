[project]
name = "geminivids-api"
version = "0.1.0"
description = "Google Vids (docs.google.com/videos) pure-protocol video generation sidecar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "curl_cffi>=0.7",
    "python-multipart>=0.0.9",
]

[project.scripts]
geminivids-api = "geminivids_api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
