[project]
name = "dreamyo-dola-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=43", "fastapi>=0.115", "httpx>=0.28", "uvicorn>=0.34", "pydantic>=2.8", "sse-starlette>=2.2"]

[project.optional-dependencies]
browser = ["camoufox[geoip]==0.5.6", "playwright>=1.50"]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
dola-api = "dola_api.app:main"
