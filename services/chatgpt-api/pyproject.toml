[project]
name = "octalaicanvas-chatgpt-api"
version = "0.1.0"
description = "Internal, loopback-only ChatGPT2API runtime for Octal Canvas"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "cryptography>=46.0.0",
    "curl-cffi>=0.15.0",
    "fastapi>=0.136.0",
    "pillow>=12.2.0",
    "pybase64>=1.4.3",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
