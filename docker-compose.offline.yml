services:
  magic-proxy:
    platform: ${DREAMYO_DOCKER_PLATFORM:-linux/amd64}
    image: ${DREAMYO_MAGIC_PROXY_IMAGE:-metacubex/mihomo:v1.19.30}
    container_name: dreamyo-magic-proxy
    entrypoint: ["/usr/local/bin/dreamyo-mihomo-entrypoint.sh"]
    environment:
      DREAMYO_MAGIC_PROXY_SECRET: ${DREAMYO_MAGIC_PROXY_SECRET:?请在 .env 中配置至少 32 位魔法代理控制密钥}
      DREAMYO_MAGIC_PROXY_LISTEN_HOST: 0.0.0.0
    volumes:
      - ./docker/mihomo/bootstrap.yaml:/root/.config/mihomo/config.yaml:ro
      - ./docker/mihomo/entrypoint.sh:/usr/local/bin/dreamyo-mihomo-entrypoint.sh:ro
      - dreamyo-magic-proxy-runtime:/root/.config/mihomo/runtime
    expose:
      - "9090"
      - "17890"
      - "17891"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q -O /dev/null -T 5 --header="Authorization: Bearer $$DREAMYO_MAGIC_PROXY_SECRET" http://127.0.0.1:9090/version',
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  geminiai:
    platform: ${DREAMYO_DOCKER_PLATFORM:-linux/amd64}
    image: ${DREAMYO_GEMINIAI_IMAGE:-dreamyo-geminiai:offline}
    container_name: dreamyo-geminiai
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AISTUDIO_API_KEY: ${DREAMYO_GEMINIAI_API_KEY:?请在 .env 中配置独立的 GeminiAI 内部密钥}
      AISTUDIO_ACCOUNTS_DIR: /data/accounts
      AISTUDIO_CONFIG_FILE: /app/config.yaml
      AISTUDIO_DUMP_RAW_RESPONSE: "0"
      AISTUDIO_HOST: 0.0.0.0
      AISTUDIO_PORT: "8080"
      AISTUDIO_PROXY: http://magic-proxy:17890
      AISTUDIO_STUDIO_URL: ${DREAMYO_GEMINIAI_STUDIO_URL:-https://aistudio.google.com/prompts/new_chat}
    volumes:
      - dreamyo-geminiai-accounts:/data/accounts
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    depends_on:
      magic-proxy:
        condition: service_healthy

  chatgpt-api:
    platform: ${DREAMYO_DOCKER_PLATFORM:-linux/amd64}
    image: ${DREAMYO_IMAGE:-dreamyo-app:offline}
    container_name: dreamyo-chatgpt-api
    working_dir: /app/services/chatgpt-api
    command:
      [
        "/app/services/chatgpt-api/.venv/bin/python",
        "main.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8046",
      ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DREAMYO_CHATGPT_API_KEY: ${DREAMYO_CHATGPT_API_KEY:?请在 .env 中配置至少 32 位 ChatGPT API 内部服务密钥}
      DREAMYO_ENCRYPTION_KEY: ${DREAMYO_ENCRYPTION_KEY:?请在 .env 中配置 DREAMYO_ENCRYPTION_KEY}
      DREAMYO_CHATGPT_DATA_DIR: /app/web/.data/chatgpt-api
    volumes:
      - dreamyo-data:/app/web/.data
    healthcheck:
      test:
        [
          "CMD",
          "/app/services/chatgpt-api/.venv/bin/python",
          "-c",
          "import os,urllib.request;req=urllib.request.Request('http://127.0.0.1:8046/integration/health',headers={'x-dreamyo-runtime-key':os.environ['DREAMYO_CHATGPT_API_KEY']});urllib.request.urlopen(req,timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    platform: ${DREAMYO_DOCKER_PLATFORM:-linux/amd64}
    image: ${DREAMYO_POSTGRES_IMAGE:-postgres:16.6-alpine}
    container_name: dreamyo-postgres
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-dreamyo}
      POSTGRES_USER: ${POSTGRES_USER:-dreamyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - dreamyo-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dreamyo} -d ${POSTGRES_DB:-dreamyo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    platform: ${DREAMYO_DOCKER_PLATFORM:-linux/amd64}
    image: ${DREAMYO_IMAGE:-dreamyo-app:offline}
    container_name: dreamyo
    env_file:
      - .env
    ports:
      - "${DREAMYO_BIND_ADDRESS:-0.0.0.0}:${DREAMYO_PORT:-${PORT:-3000}}:${PORT:-3000}"
    volumes:
      - dreamyo-data:/app/web/.data
      - dreamyo-magic-proxy-runtime:/app/web/.magic-proxy-runtime
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: ${PORT:-3000}
      NEXT_TELEMETRY_DISABLED: "1"
      DREAMYO_DATA_DIR: /app/web/.data
      DREAMYO_INTERNAL_ORIGIN: http://127.0.0.1:${PORT:-3000}
      DREAMYO_DATABASE_PROVIDER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-dreamyo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dreamyo}
      DREAMYO_DATABASE_POOL_MAX: ${DREAMYO_DATABASE_POOL_MAX:-10}
      DREAMYO_DATABASE_SSL: "0"
      DREAMYO_ENCRYPTION_KEY: ${DREAMYO_ENCRYPTION_KEY:?请在 .env 中配置 DREAMYO_ENCRYPTION_KEY}
      DREAMYO_INSTALL_TOKEN: ${DREAMYO_INSTALL_TOKEN:?请在 .env 中配置至少 32 位一次性安装令牌}
      DREAMYO_MAINTENANCE_TOKEN: ${DREAMYO_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      DREAMYO_WORKER_TOKEN: ${DREAMYO_WORKER_TOKEN:?请在 .env 中配置独立的至少 32 位 Worker 令牌}
      DREAMYO_MAGIC_PROXY_CONTROLLER_URL: http://magic-proxy:9090
      DREAMYO_MAGIC_PROXY_SECRET: ${DREAMYO_MAGIC_PROXY_SECRET:?请在 .env 中配置至少 32 位魔法代理控制密钥}
      DREAMYO_MAGIC_PROXY_PROVIDER_FILE: /app/web/.magic-proxy-runtime/subscription.yaml
      DREAMYO_MAGIC_PROXY_GEMINIAI_URL: http://magic-proxy:17890
      DREAMYO_MAGIC_PROXY_GEMINI_TOOLS_URL: http://magic-proxy:17891
      DREAMYO_MAGIC_PROXY_CHATGPT_API_URL: http://magic-proxy:17892
      DREAMYO_MAGIC_PROXY_DOLA_URL: http://magic-proxy:17893
      DREAMYO_MAGIC_PROXY_LISTEN_HOST: 0.0.0.0
      DREAMYO_MAGIC_PROXY_GEMINIAI_PORT: "17890"
      DREAMYO_MAGIC_PROXY_GEMINI_TOOLS_PORT: "17891"
      DREAMYO_MAGIC_PROXY_CHATGPT_API_PORT: "17892"
      DREAMYO_MAGIC_PROXY_DOLA_PORT: "17893"
      DREAMYO_GEMINIAI_URL: http://geminiai:8080
      DREAMYO_GEMINIAI_API_KEY: ${DREAMYO_GEMINIAI_API_KEY:?请在 .env 中配置独立的 GeminiAI 内部密钥}
      GEMINI_TOOLS_OAUTH_CLIENT_ID: ${GEMINI_TOOLS_OAUTH_CLIENT_ID:-}
      GEMINI_TOOLS_OAUTH_CLIENT_SECRET: ${GEMINI_TOOLS_OAUTH_CLIENT_SECRET:-}
      GEMINI_TOOLS_OAUTH_REDIRECT_URI: ${GEMINI_TOOLS_OAUTH_REDIRECT_URI:-}
      DREAMYO_CHATGPT_API_URL: http://chatgpt-api:8046
      DREAMYO_CHATGPT_API_KEY: ${DREAMYO_CHATGPT_API_KEY:?请在 .env 中配置至少 32 位 ChatGPT API 内部服务密钥}
    depends_on:
      postgres:
        condition: service_healthy
      geminiai:
        condition: service_healthy
      chatgpt-api:
        condition: service_healthy
      magic-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||3000;fetch('http://127.0.0.1:'+p+'/api/health/live').then(async live=>{if(!live.ok)throw new Error('live');const ready=await fetch('http://127.0.0.1:'+p+'/api/health/ready');const body=await ready.json();if(!body?.data?.database?.healthy)throw new Error('database')}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    platform: ${DREAMYO_DOCKER_PLATFORM:-linux/amd64}
    image: ${DREAMYO_IMAGE:-dreamyo-app:offline}
    container_name: dreamyo-generation-worker
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DREAMYO_WORKER_API_ORIGIN: http://app:3000
      DREAMYO_WORKER_TOKEN: ${DREAMYO_WORKER_TOKEN:?请在 .env 中配置独立的至少 32 位 Worker 令牌}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dreamyo-data:
  dreamyo-geminiai-accounts:
  dreamyo-postgres:
  dreamyo-magic-proxy-runtime:
