services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-octalaicanvas}
      POSTGRES_USER: ${POSTGRES_USER:-octalaicanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - octalaicanvas-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-octalaicanvas} -d ${POSTGRES_DB:-octalaicanvas}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: octalaicanvas:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - octalaicanvas-data:/app/web/.data
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      OCTALAICANVAS_DATA_DIR: /app/web/.data
      OCTALAICANVAS_INTERNAL_ORIGIN: http://127.0.0.1:3000
      OCTALAICANVAS_DATABASE_PROVIDER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-octalaicanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-octalaicanvas}
      OCTALAICANVAS_DATABASE_POOL_MAX: ${OCTALAICANVAS_DATABASE_POOL_MAX:-10}
      OCTALAICANVAS_DATABASE_SSL: "0"
      OCTALAICANVAS_ENCRYPTION_KEY: ${OCTALAICANVAS_ENCRYPTION_KEY:?请在 .env 中配置 OCTALAICANVAS_ENCRYPTION_KEY}
      OCTALAICANVAS_INSTALL_TOKEN: ${OCTALAICANVAS_INSTALL_TOKEN:?请在 .env 中配置至少 32 位一次性安装令牌}
      OCTALAICANVAS_MAINTENANCE_TOKEN: ${OCTALAICANVAS_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      OCTALAICANVAS_WORKER_TOKEN: ${OCTALAICANVAS_WORKER_TOKEN:?请在 .env 中配置独立的至少 32 位 Worker 令牌}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    image: octalaicanvas:local
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    environment:
      OCTALAICANVAS_WORKER_API_ORIGIN: http://app:3000
      OCTALAICANVAS_WORKER_TOKEN: ${OCTALAICANVAS_WORKER_TOKEN:?请在 .env 中配置独立的至少 32 位 Worker 令牌}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  octalaicanvas-data:
  octalaicanvas-postgres:
